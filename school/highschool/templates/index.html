{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Django Tailwind CMS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% tailwind_css %}
</head>

<body class="bg-gray-50 text-black font-serif leading-normal tracking-normal">

<div class="container mx-auto px-4">
    <section class="flex flex-col items-center justify-center min-h-screen space-y-10">

        <!-- CMS FORM -->
        <div class="w-full max-w-lg bg-white shadow-lg rounded-lg p-8">
            
            <h1 class="text-4xl font-bold mb-6 text-center">
                Highschool CMS
            </h1>

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Title
                    </label>
                    <input 
                        type="text"
                        name="title"
                        placeholder="Enter title"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Content
                    </label>
                    <textarea
                        name="content"
                        rows="4"
                        placeholder="Enter content..."
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="flex gap-3">

                    <button 
                        type="submit"
                        class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
                    >
                        Post
                    </button>

                    <button 
                        type="button"
                        class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition"
                    >
                        Add
                    </button>

                    <button 
                        type="button"
                        class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition"
                    >
                        Delete
                    </button>

                </div>

            </form>

        </div>

        <!-- POSTS LIST -->
        <div class="w-full max-w-lg space-y-4">

            <h2 class="text-2xl font-bold text-center">
                Posts
            </h2>

            <!-- Example Post -->
            <div class="bg-white shadow rounded-lg p-4 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">Sample Title</h3>
                    <p class="text-gray-600 text-sm">Sample content from CMS...</p>
                </div>

                <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
                    Delete
                </button>
            </div>

        </div>

    </section>
</div>

</body>
</html>
